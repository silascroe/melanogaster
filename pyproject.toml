[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flytest"
version = "0.1.0"
description = "Small, inspectable Drosophila Male CNS connectome analysis and simulation baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "pyarrow>=19",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
flytest-inspect = "flytest.analysis:main"
flytest-baseline = "flytest.baseline:main"
flytest-verify = "flytest.verify:main"
flytest-propagation-diagnostic = "flytest.propagation_diagnostic:main"
flytest-pathway-slice = "flytest.pathway_slice:main"
flytest-synaptic-dynamics = "flytest.synaptic_dynamics_diagnostic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
